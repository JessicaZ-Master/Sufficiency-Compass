<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Sufficiency Compass</title>
<style>
:root{
  --petrol:#0F766E;
  --petrol-dark:#115E59;
  --petrol-soft:#E6F4F2;
  --ink:#1F2937;
  --muted:#667085;
  --line:#D8E1E5;
  --paper:#FFFFFF;
  --bg:#F5F8F8;
  --soft:#F8FAFA;
  --warn:#8A5A00;
  --warn-bg:#FFF7E6;
  --danger:#8B3434;
  --danger-bg:#FDF0F0;
  --o1:#4F6D7A;
  --o2:#4F7D78;
  --o3:#A06A2C;
  --o4:#6B67A8;
  --o5:#28715B;
  --o6:#7B667C;
  --shadow:0 8px 30px rgba(31,41,55,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}
.app-shell{min-height:100vh}
.topbar{height:68px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;text-decoration:none;min-width:0}
.brand-logo{display:block;width:210px;max-width:42vw;height:54px}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:0;background:white;padding:7px 10px;color:var(--muted);cursor:pointer}
.lang button.active{background:var(--petrol);color:white}
main{max-width:980px;margin:0 auto;padding:48px 24px 72px}
.hero{padding:70px 0 40px}
.eyebrow{font-size:13px;font-weight:700;color:var(--petrol);text-transform:uppercase;letter-spacing:.08em}
h1{font-size:48px;line-height:1.07;margin:12px 0 18px;letter-spacing:-.04em}
.hero p{font-size:19px;line-height:1.65;color:var(--muted);max-width:760px}
.value-box{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:32px 0}
.mini-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.mini-card strong{display:block;margin-bottom:6px}
.mini-card span{color:var(--muted);line-height:1.5;font-size:14px}
.primary{border:0;background:var(--petrol);color:white;padding:13px 20px;border-radius:10px;font-weight:700;cursor:pointer}
.primary:hover{background:var(--petrol-dark)}
.secondary{border:1px solid var(--line);background:white;color:var(--ink);padding:12px 18px;border-radius:10px;font-weight:650;cursor:pointer}
.secondary:hover{border-color:#A9BEC2}
.secondary:disabled,.primary:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.module-header{margin-bottom:22px}
.module-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.module-meta small{color:var(--muted)}
.module-title{font-size:29px;margin:4px 0 6px;letter-spacing:-.025em}
.module-purpose{color:var(--muted);font-size:16px}
.progress{height:7px;background:#DDE8E7;border-radius:99px;overflow:hidden;margin:20px 0 30px}
.progress > div{height:100%;background:var(--petrol);transition:width .2s ease}
.stage-label{font-weight:750;color:var(--petrol);font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin:28px 0 12px}
.q-card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:22px;margin:14px 0;box-shadow:0 2px 10px rgba(31,41,55,.025)}
.q-head{display:flex;gap:9px;align-items:flex-start}
.q-id{font-size:12px;color:var(--muted);font-weight:750;min-width:38px;padding-top:3px}
.q-text{font-size:17px;line-height:1.5;font-weight:650;flex:1}
.multi-badge{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:999px;background:var(--petrol-soft);color:var(--petrol-dark);font-size:11px;font-weight:800;line-height:1.25;vertical-align:2px;white-space:nowrap}
.help{position:relative;flex:0 0 auto}
.help-btn{width:25px;height:25px;border-radius:50%;border:1px solid #B8C7CB;background:white;color:var(--petrol);font-weight:800;cursor:pointer;line-height:22px}
.tooltip{display:none;position:absolute;right:0;top:32px;width:min(440px,75vw);background:#163B3A;color:white;border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.5;font-weight:400;z-index:8;box-shadow:var(--shadow)}
.help:hover .tooltip,.help.open .tooltip{display:block}
.options{display:grid;gap:8px;margin-top:18px}
.option{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.option:hover{border-color:#98B6B3;background:#FBFEFD}
.option.selected{border-color:var(--petrol);background:var(--petrol-soft)}
.option input{margin-top:3px;accent-color:var(--petrol)}
.examples-toggle{border:0;background:transparent;color:var(--petrol);font-size:13px;font-weight:700;padding:10px 0 0;cursor:pointer}
.examples{margin-top:9px;padding:12px 14px;background:var(--soft);border-radius:9px;color:var(--muted);font-size:13px;line-height:1.55}
.api-error{background:#FDECEC;border:1px solid #E9B9B9;color:#7A2929;padding:13px 15px;border-radius:10px;margin:0 0 18px;line-height:1.5;font-size:13px}
.notice{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:#704A08;font-size:13px;line-height:1.5}
.specialist-checkpoint{margin-top:8px;padding-top:8px;border-top:1px solid rgba(112,74,8,.22)}
.specialist-checkpoint strong{color:#5B3C06}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.stepper{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.step-pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--muted);background:white}
.step-pill.active{background:var(--petrol-soft);color:var(--petrol-dark);border-color:#9FC7C3;font-weight:750}
.step-pill.done{color:var(--ink);border-color:#BBC9CC}
.result-card{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);border-top:6px solid var(--outcome)}
.result-kicker{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.result-title{font-size:34px;letter-spacing:-.03em;margin:8px 0 10px}
.result-desc{font-size:17px;line-height:1.6;color:var(--muted)}
.result-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-top:22px}
.result-section{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:18px}
.result-section h3{margin:0 0 10px;font-size:16px}
.result-section ul{margin:0;padding-left:19px;color:var(--muted);line-height:1.7}
.action-list{display:grid;gap:12px}
.action-card{background:white;border:1px solid var(--line);border-left:4px solid var(--outcome);border-radius:11px;padding:15px 16px}
.action-card-title{font-size:14px;font-weight:780;margin-bottom:5px;color:var(--ink)}
.action-card-text{font-size:13.5px;line-height:1.55;color:var(--muted)}
.action-card-meta{display:inline-block;margin-top:8px;font-size:11px;font-weight:750;letter-spacing:.03em;text-transform:uppercase;color:var(--petrol-dark);background:var(--petrol-soft);border-radius:5px;padding:4px 7px}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.privacy{margin-top:26px;color:var(--muted);font-size:12px}
.validation-notice{margin:24px 0;padding:16px 18px;border:1px solid #9FC7C3;border-left:5px solid var(--petrol);border-radius:12px;background:var(--petrol-soft);color:var(--ink);line-height:1.55}
.validation-notice strong{display:block;margin-bottom:6px;color:var(--petrol-dark);font-size:15px}
.validation-notice div{font-size:14px}
@media(max-width:720px){
  .brand-logo{width:168px;max-width:55vw;height:46px}
  .topbar{padding:0 16px}
  main{padding:28px 16px 54px}
  .hero{padding:42px 0 20px}
  h1{font-size:38px}
  .value-box,.result-grid{grid-template-columns:1fr}
  .module-meta{display:block}
  .q-card{padding:18px}
  .result-title{font-size:28px}
}
@media print{
  .topbar,.result-actions,.privacy,.validation-notice{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  #resultScreen{display:block!important}
  .result-card{box-shadow:none;border:1px solid #bbb}
}
</style>
</head>

  </main>
</div>

function setApiError(msg){
 ["apiErrorAssessment","apiErrorResult"].forEach(id=>{
   const el=document.getElementById(id); if(!el)return;
   if(msg){el.textContent=msg;el.classList.remove("hidden")}else{el.textContent="";el.classList.add("hidden")}
 });
}
async function evaluate(intent="state"){
 const base=apiBase();
 if(!base || base.includes("REPLACE-WITH-ENGINE-URL")){
   throw new Error(lang==="en"?
   "The decision-engine URL has not been configured yet. Set window.SUFFICIENCY_COMPASS_API in config.js after the private engine is deployed.":
   "Die URL der Decision Engine ist noch nicht konfiguriert. Tragen Sie nach dem Deployment der privaten Engine die URL in config.js ein.");
 }
 const res=await fetch(base+"/evaluate",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({answers:A,current_module:current,intent,lang})
 });
 if(!res.ok){
   let detail=""; try{detail=(await res.json()).detail||""}catch(e){}
   throw new Error(detail || `Engine request failed (${res.status})`);
 }
 const data=await res.json();
 A=data.answers||{}; visibleIds=data.visible_question_ids||[]; moduleCompleteState=!!data.module_complete;
 return data;
}
function i18n(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=T[lang][el.dataset.i18n]||"");
 document.getElementById("langEN").classList.toggle("active",lang==="en");
 document.getElementById("langDE").classList.toggle("active",lang==="de");
 if(!document.getElementById("assessmentScreen").classList.contains("hidden")) renderModule();
 if(!document.getElementById("resultScreen").classList.contains("hidden")) renderResult(result);
}
function renderStepper(){
 const e=document.getElementById("stepper");e.innerHTML="";
 modules.forEach(m=>{const s=document.createElement("span");s.className="step-pill"+(m.id===current?" active":m.id<current?" done":"");s.textContent=`${m.id} ${m.title[lang].replace(/ &.*/,"")}`;e.appendChild(s)})
}
function optLabel(o){return lang==="en"?o[1]:o[2]}
function renderQuestion(x){
 const card=document.createElement("div");card.className="q-card";
 const help=lang==="en"?x.helpEn:x.helpDe;
 card.innerHTML=`<div class="q-head"><div class="q-id">${x.id}</div><div class="q-text">${lang==="en"?x.en:x.de}${x.multi?`<span class="multi-badge">${T[lang].multiSelect}</span>`:""}</div><div class="help"><button class="help-btn" aria-label="Help">?</button><div class="tooltip">${help}</div></div></div>`;
 const helpWrap=card.querySelector(".help"),helpBtn=card.querySelector(".help-btn");
 helpBtn.addEventListener("click",e=>{e.stopPropagation();helpWrap.classList.toggle("open")});
 const opts=document.createElement("div");opts.className="options";
 x.opts.forEach(o=>{
   const val=o[0],lab=document.createElement("label"),selected=x.multi?(A[x.id]||[]).includes(val):A[x.id]===val;
   lab.className="option"+(selected?" selected":"");
   lab.innerHTML=`<input type="${x.multi?"checkbox":"radio"}" name="${x.id}" value="${val}" ${selected?"checked":""}><span>${optLabel(o)}</span>`;
   lab.querySelector("input").addEventListener("change",async ev=>{
     if(x.multi){
       let arr=Array.isArray(A[x.id])?[...A[x.id]]:[];
       if(ev.target.checked){
         if(["cannot","no_value","none"].includes(val))arr=[val];
         else{arr=arr.filter(z=>!["cannot","no_value","none"].includes(z));if(!arr.includes(val))arr.push(val)}
       }else arr=arr.filter(z=>z!==val);
       A[x.id]=arr;
     }else A[x.id]=val;
     try{setApiError("");await evaluate("state")}catch(err){setApiError(err.message)}
     renderModule();
   });
   opts.appendChild(lab)
 });
 card.appendChild(opts);
 const ex=lang==="en"?x.examplesEn:x.examplesDe;
 if(ex&&ex.length){
   const b=document.createElement("button");b.className="examples-toggle";b.textContent=T[lang].examples+" ▾";
   const d=document.createElement("div");d.className="examples hidden";d.textContent=ex.join(" · ");
   b.addEventListener("click",()=>{d.classList.toggle("hidden");b.textContent=(d.classList.contains("hidden")?T[lang].examples:T[lang].hideExamples)+(d.classList.contains("hidden")?" ▾":" ▴")});
   card.appendChild(b);card.appendChild(d)
 }
 const v=A[x.id],isCannot=v==="cannot"||(Array.isArray(v)&&v.includes("cannot"));
 if(isCannot){
   const n=document.createElement("div");n.className="notice";
   const sp=specialistCheckpoints[x.id];
   n.innerHTML=`<strong>${T[lang].cannotTitle}</strong><br>${T[lang].cannotText}`+(sp?`<div class="specialist-checkpoint"><strong>${T[lang].specialistLabel}:</strong><br>${sp[lang]}</div>`:"");
   card.appendChild(n)
 }
 return card
}
function renderModule(){
 renderStepper();
 const m=modules[current-1];
 document.getElementById("moduleCount").textContent=T[lang].moduleOf.replace("{n}",current);
 document.getElementById("moduleTitle").textContent=m.title[lang];
 document.getElementById("modulePurpose").textContent=m.purpose[lang];
 document.getElementById("progressFill").style.width=`${(current/6)*100}%`;
 const box=document.getElementById("questions");box.innerHTML="";
 const visible=questions.filter(x=>x.module===current && visibleIds.includes(x.id));
 if(current===6){
   let lastStage=null;
   visible.forEach(x=>{
     if(x.stage&&x.stage!==lastStage){
       const s=document.createElement("div");s.className="stage-label";
       s.textContent=x.stage==="A"?(lang==="en"?"Stage A · Before implementation":"Stage A · Vor Implementierung"):(lang==="en"?"Stage B · Pilot / actual use":"Stage B · Pilot / tatsächliche Nutzung");
       box.appendChild(s);lastStage=x.stage
     }
     box.appendChild(renderQuestion(x))
   })
 }else visible.forEach(x=>box.appendChild(renderQuestion(x)));
 document.getElementById("backBtn").disabled=current===1;
 document.getElementById("continueBtn").disabled=!moduleCompleteState;
}
function renderResult(r){
 if(!r)return;
 const card=document.getElementById("resultCard");card.style.setProperty("--outcome",r.color||"var(--petrol)");
 document.getElementById("resultTitle").textContent=r.title;
 document.getElementById("resultDesc").textContent=r.description;
 const wl=document.getElementById("whyList");wl.innerHTML="";(r.why||[]).forEach(x=>{const li=document.createElement("li");li.textContent=x;wl.appendChild(li)});
 document.getElementById("nextText").textContent=r.next_step||"";
 const al=document.getElementById("actionList");al.innerHTML="";
 const acts=r.actions||[];
 if(!acts.length){const d=document.createElement("div");d.className="action-card";d.innerHTML=`<div class="action-card-text">${T[lang].noIssues}</div>`;al.appendChild(d)}
 else acts.forEach(a=>{const d=document.createElement("div");d.className="action-card";d.innerHTML=`<div class="action-card-title">${a.title}</div><div class="action-card-text">${a.text}</div><span class="action-card-meta">${a.meta}</span>`;al.appendChild(d)})
}
function showResult(r){
 result=r;document.getElementById("assessmentScreen").classList.add("hidden");document.getElementById("startScreen").classList.add("hidden");document.getElementById("resultScreen").classList.remove("hidden");renderResult(r);window.scrollTo({top:0,behavior:"smooth"})
}
document.getElementById("startBtn").onclick=async()=>{
 document.getElementById("startScreen").classList.add("hidden");document.getElementById("assessmentScreen").classList.remove("hidden");current=1;A={};result=null;
 try{setApiError("");await evaluate("state")}catch(err){setApiError(err.message)}
 renderModule();window.scrollTo(0,0)
};
document.getElementById("continueBtn").onclick=async()=>{
 if(!moduleCompleteState)return;
 try{
   setApiError("");const data=await evaluate("continue");
   if(data.result){showResult(data.result);return}
   if(data.next_module){current=data.next_module;await evaluate("state");renderModule();window.scrollTo({top:0,behavior:"smooth"})}
 }catch(err){setApiError(err.message)}
};
document.getElementById("backBtn").onclick=async()=>{
 if(current<=1)return;current--;
 try{setApiError("");await evaluate("state")}catch(err){setApiError(err.message)}
 renderModule();window.scrollTo({top:0,behavior:"smooth"})
};
document.getElementById("langEN").onclick=async()=>{lang="en";i18n();if(!document.getElementById("assessmentScreen").classList.contains("hidden")){try{await evaluate("state");renderModule()}catch(e){setApiError(e.message)}}};
document.getElementById("langDE").onclick=async()=>{lang="de";i18n();if(!document.getElementById("assessmentScreen").classList.contains("hidden")){try{await evaluate("state");renderModule()}catch(e){setApiError(e.message)}}};
document.getElementById("pdfBtn").onclick=()=>window.print();
document.getElementById("editBtn").onclick=async()=>{document.getElementById("resultScreen").classList.add("hidden");document.getElementById("assessmentScreen").classList.remove("hidden");try{setApiError("");await evaluate("state")}catch(e){setApiError(e.message)}renderModule();window.scrollTo(0,0)};
document.getElementById("restartBtn").onclick=()=>{A={};current=1;result=null;visibleIds=[];moduleCompleteState=false;document.getElementById("resultScreen").classList.add("hidden");document.getElementById("startScreen").classList.remove("hidden");i18n();window.scrollTo(0,0)};
document.addEventListener("click",e=>{if(!e.target.closest(".help"))document.querySelectorAll(".help.open").forEach(x=>x.classList.remove("open"))});
i18n();

</script>
</body>
</html>
