<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Sufficiency Compass</title>
<style>
:root{
  --petrol:#0F766E;
  --petrol-dark:#115E59;
  --petrol-soft:#E6F4F2;
  --ink:#1F2937;
  --muted:#667085;
  --line:#D8E1E5;
  --paper:#FFFFFF;
  --bg:#F5F8F8;
  --soft:#F8FAFA;
  --warn:#8A5A00;
  --warn-bg:#FFF7E6;
  --danger:#8B3434;
  --danger-bg:#FDF0F0;
  --o1:#4F6D7A;
  --o2:#4F7D78;
  --o3:#A06A2C;
  --o4:#6B67A8;
  --o5:#28715B;
  --o6:#7B667C;
  --shadow:0 8px 30px rgba(31,41,55,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}
.app-shell{min-height:100vh}
.topbar{height:68px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;text-decoration:none;min-width:0}
.brand-logo{display:block;width:210px;max-width:42vw;height:54px}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:0;background:white;padding:7px 10px;color:var(--muted);cursor:pointer}
.lang button.active{background:var(--petrol);color:white}
main{max-width:980px;margin:0 auto;padding:48px 24px 72px}
.hero{padding:70px 0 40px}
.eyebrow{font-size:13px;font-weight:700;color:var(--petrol);text-transform:uppercase;letter-spacing:.08em}
h1{font-size:48px;line-height:1.07;margin:12px 0 18px;letter-spacing:-.04em}
.hero p{font-size:19px;line-height:1.65;color:var(--muted);max-width:760px}
.value-box{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:32px 0}
.mini-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.mini-card strong{display:block;margin-bottom:6px}
.mini-card span{color:var(--muted);line-height:1.5;font-size:14px}
.primary{border:0;background:var(--petrol);color:white;padding:13px 20px;border-radius:10px;font-weight:700;cursor:pointer}
.primary:hover{background:var(--petrol-dark)}
.secondary{border:1px solid var(--line);background:white;color:var(--ink);padding:12px 18px;border-radius:10px;font-weight:650;cursor:pointer}
.secondary:hover{border-color:#A9BEC2}
.secondary:disabled,.primary:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.module-header{margin-bottom:22px}
.module-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.module-meta small{color:var(--muted)}
.module-title{font-size:29px;margin:4px 0 6px;letter-spacing:-.025em}
.module-purpose{color:var(--muted);font-size:16px}
.progress{height:7px;background:#DDE8E7;border-radius:99px;overflow:hidden;margin:20px 0 30px}
.progress > div{height:100%;background:var(--petrol);transition:width .2s ease}
.stage-label{font-weight:750;color:var(--petrol);font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin:28px 0 12px}
.q-card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:22px;margin:14px 0;box-shadow:0 2px 10px rgba(31,41,55,.025)}
.q-head{display:flex;gap:9px;align-items:flex-start}
.q-id{font-size:12px;color:var(--muted);font-weight:750;min-width:38px;padding-top:3px}
.q-text{font-size:17px;line-height:1.5;font-weight:650;flex:1}
.multi-badge{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:999px;background:var(--petrol-soft);color:var(--petrol-dark);font-size:11px;font-weight:800;line-height:1.25;vertical-align:2px;white-space:nowrap}
.help{position:relative;flex:0 0 auto}
.help-btn{width:25px;height:25px;border-radius:50%;border:1px solid #B8C7CB;background:white;color:var(--petrol);font-weight:800;cursor:pointer;line-height:22px}
.tooltip{display:none;position:absolute;right:0;top:32px;width:min(440px,75vw);background:#163B3A;color:white;border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.5;font-weight:400;z-index:8;box-shadow:var(--shadow)}
.help:hover .tooltip,.help.open .tooltip{display:block}
.options{display:grid;gap:8px;margin-top:18px}
.option{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.option:hover{border-color:#98B6B3;background:#FBFEFD}
.option.selected{border-color:var(--petrol);background:var(--petrol-soft)}
.option input{margin-top:3px;accent-color:var(--petrol)}
.examples-toggle{border:0;background:transparent;color:var(--petrol);font-size:13px;font-weight:700;padding:10px 0 0;cursor:pointer}
.examples{margin-top:9px;padding:12px 14px;background:var(--soft);border-radius:9px;color:var(--muted);font-size:13px;line-height:1.55}
.api-error{background:#FDECEC;border:1px solid #E9B9B9;color:#7A2929;padding:13px 15px;border-radius:10px;margin:0 0 18px;line-height:1.5;font-size:13px}
.notice{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:#704A08;font-size:13px;line-height:1.5}
.specialist-checkpoint{margin-top:8px;padding-top:8px;border-top:1px solid rgba(112,74,8,.22)}
.specialist-checkpoint strong{color:#5B3C06}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.stepper{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.step-pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--muted);background:white}
.step-pill.active{background:var(--petrol-soft);color:var(--petrol-dark);border-color:#9FC7C3;font-weight:750}
.step-pill.done{color:var(--ink);border-color:#BBC9CC}
.result-card{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);border-top:6px solid var(--outcome)}
.result-kicker{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.result-title{font-size:34px;letter-spacing:-.03em;margin:8px 0 10px}
.result-desc{font-size:17px;line-height:1.6;color:var(--muted)}
.result-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-top:22px}
.result-section{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:18px}
.result-section h3{margin:0 0 10px;font-size:16px}
.result-section ul{margin:0;padding-left:19px;color:var(--muted);line-height:1.7}
.action-list{display:grid;gap:12px}
.action-card{background:white;border:1px solid var(--line);border-left:4px solid var(--outcome);border-radius:11px;padding:15px 16px}
.action-card-title{font-size:14px;font-weight:780;margin-bottom:5px;color:var(--ink)}
.action-card-text{font-size:13.5px;line-height:1.55;color:var(--muted)}
.action-card-meta{display:inline-block;margin-top:8px;font-size:11px;font-weight:750;letter-spacing:.03em;text-transform:uppercase;color:var(--petrol-dark);background:var(--petrol-soft);border-radius:5px;padding:4px 7px}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.privacy{margin-top:26px;color:var(--muted);font-size:12px}
.validation-notice{margin:24px 0;padding:16px 18px;border:1px solid #9FC7C3;border-left:5px solid var(--petrol);border-radius:12px;background:var(--petrol-soft);color:var(--ink);line-height:1.55}
.validation-notice strong{display:block;margin-bottom:6px;color:var(--petrol-dark);font-size:15px}
.validation-notice div{font-size:14px}
.framing-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}
.field.full{grid-column:1/-1}
.field label{display:block;font-weight:750;margin-bottom:7px}
.field small{display:block;color:var(--muted);line-height:1.45;margin-bottom:8px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink)}
.field textarea{min-height:92px;resize:vertical}
.diagnostic-banner{margin:0 0 18px;padding:14px 16px;border:1px solid #D6B36B;background:var(--warn-bg);border-radius:11px;color:#6F4A08;line-height:1.5}
.trace-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.trace-card{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px}
.trace-card.full{grid-column:1/-1}
.trace-card h3{margin:0 0 9px;font-size:15px}
.trace-card p,.trace-card li{color:var(--muted);line-height:1.55}
.specialist-task{border-left:4px solid var(--petrol);background:#fff;border-radius:9px;padding:12px 14px;margin:9px 0}
.specialist-task b{display:block;margin-bottom:4px}
.assist-box{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.assist-toggle{border:0;background:var(--petrol-soft);color:var(--petrol-dark);border-radius:8px;padding:8px 11px;font-weight:750;cursor:pointer}
.assist-panel{margin-top:10px}
.assist-note{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:9px}
.assist-actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.assist-actions button{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 9px;cursor:pointer}
.assist-clarify{display:flex;gap:7px;align-items:flex-start}
.assist-clarify textarea{flex:1;min-height:62px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.assist-output{margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:8px;line-height:1.5;white-space:pre-wrap}
.assist-output.loading{font-style:italic;color:var(--muted)}
@media(max-width:720px){.framing-grid,.trace-grid{grid-template-columns:1fr}.field.full,.trace-card.full{grid-column:auto}}
@media(max-width:720px){
  .brand-logo{width:168px;max-width:55vw;height:46px}
  .topbar{padding:0 16px}
  main{padding:28px 16px 54px}
  .hero{padding:42px 0 20px}
  h1{font-size:38px}
  .value-box,.result-grid{grid-template-columns:1fr}
  .module-meta{display:block}
  .q-card{padding:18px}
  .result-title{font-size:28px}
}
@media print{
  .topbar,.result-actions,.privacy,.validation-notice{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  #resultScreen{display:block!important}
  .result-card{box-shadow:none;border:1px solid #bbb}
}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="./" aria-label="Sufficiency Compass">
      <svg class="brand-logo" viewBox="0 0 940 240" role="img" aria-labelledby="brandLogoTitle brandLogoDesc">
        <title id="brandLogoTitle">Sufficiency Compass</title>
        <desc id="brandLogoDesc">SC monogram with compass motif and Sufficiency Compass wordmark</desc>
        <defs>
          <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22B8B2"/>
            <stop offset="1" stop-color="#0F766E"/>
          </linearGradient>
        </defs>
        <g transform="translate(15 18)">
          <path d="M151 29 A83 83 0 1 0 151 177" fill="none" stroke="#0B5261" stroke-width="27" stroke-linecap="round"/>
          <path d="M67 34 C121 15 146 44 121 68 C97 91 61 83 58 110 C55 137 102 132 124 150 C147 169 131 196 81 192 C58 190 42 181 30 170"
                fill="none" stroke="url(#brandGradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M122 101 L172 82 L151 130 Z" fill="#169C98"/>
          <path d="M122 101 L151 130 L143 105 Z" fill="#0A5E68"/>
        </g>
        <g fill="#083E4B" font-family="Inter,Segoe UI,Arial,sans-serif">
          <text x="228" y="105" font-size="74" font-weight="760" letter-spacing="-2">Sufficiency</text>
          <text x="228" y="185" font-size="74" font-weight="650" letter-spacing="-2">Compass</text>
        </g>
      </svg>
    </a>
    <div class="lang"><button id="langEN" class="active">EN</button><button id="langDE">DE</button></div>
  </header>
  <main>
    <section id="startScreen">
      <div class="hero">
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1>Sufficiency Compass</h1>
        <p data-i18n="tagline"></p>
        <p data-i18n="intro"></p>
        <div class="value-box">
          <div class="mini-card"><strong data-i18n="whatGetTitle"></strong><span data-i18n="whatGetText"></span></div>
          <div class="mini-card"><strong data-i18n="howWorksTitle"></strong><span data-i18n="howWorksText"></span></div>
        </div>
        <button class="primary" id="startBtn" data-i18n="start"></button>
        <div class="privacy" data-i18n="privacy"></div>
      </div>
    </section>


    <section id="framingScreen" class="hidden">
      <div class="module-header">
        <div class="eyebrow" data-i18n="framingEyebrow"></div>
        <h2 class="module-title" data-i18n="framingTitle"></h2>
        <div class="module-purpose" data-i18n="framingIntro"></div>
      </div>
      <div class="framing-grid">
        <div class="field full"><label data-i18n="df1Label"></label><small data-i18n="df1Help"></small><textarea data-df="DF.1"></textarea></div>
        <div class="field"><label data-i18n="df2Label"></label><small data-i18n="df2Help"></small><textarea data-df="DF.2"></textarea></div>
        <div class="field"><label data-i18n="df3Label"></label><small data-i18n="df3Help"></small><textarea data-df="DF.3"></textarea></div>
        <div class="field"><label data-i18n="df4Label"></label><small data-i18n="df4Help"></small><input data-df="DF.4" type="text"></div>
        <div class="field"><label data-i18n="df5Label"></label><small data-i18n="df5Help"></small><input data-df="DF.5" type="text"></div>
        <div class="field full"><label data-i18n="df6Label"></label><small data-i18n="df6Help"></small>
          <select data-df="DF.6"><option value=""></option><option value="existing" data-i18n-option="df6Existing"></option><option value="greenfield" data-i18n-option="df6Greenfield"></option></select>
        </div>
      </div>
      <div class="nav">
        <button class="secondary" id="framingBackBtn" data-i18n="back"></button>
        <button class="primary" id="framingContinueBtn" data-i18n="continue"></button>
      </div>
    </section>

    <section id="assessmentScreen" class="hidden"><div id="apiErrorAssessment" class="api-error hidden"></div><div id="diagnosticBanner" class="diagnostic-banner hidden"></div>
      <div class="stepper" id="stepper"></div>
      <div class="module-header">
        <div class="module-meta">
          <div>
            <small id="moduleCount"></small>
            <h2 class="module-title" id="moduleTitle"></h2>
            <div class="module-purpose" id="modulePurpose"></div>
          </div>
        </div>
        <div class="progress"><div id="progressFill"></div></div>
      </div>
      <div id="questions"></div>
      <div class="nav">
        <button class="secondary" id="backBtn" data-i18n="back"></button>
        <button class="secondary hidden" id="finishBtn" data-i18n="finishCurrent"></button>
        <button class="primary" id="continueBtn" data-i18n="continue"></button>
      </div>
    </section>

    <section id="resultScreen" class="hidden"><div id="apiErrorResult" class="api-error hidden"></div>
      <div class="result-card" id="resultCard">
        <div class="result-kicker" data-i18n="yourRecommendation"></div>
        <h2 class="result-title" id="resultTitle"></h2>
        <div class="result-desc" id="resultDesc"></div>
        <div class="trace-grid">
          <div class="trace-card full"><h3 data-i18n="decisionContext"></h3><p id="decisionContextText"></p></div>
          <div class="trace-card"><h3 data-i18n="gateStatus"></h3><div id="gateStatusText"></div></div>
          <div class="trace-card"><h3 data-i18n="economicSufficiency"></h3><p id="economicText"></p></div>
        </div>
        <div class="result-grid">
          <div class="result-section">
            <h3 data-i18n="why"></h3>
            <ul id="whyList"></ul>
          </div>
          <div class="result-section">
            <h3 data-i18n="next"></h3>
            <div id="nextText" style="color:var(--muted);line-height:1.6"></div>
          </div>
        </div>
        <div class="result-section" style="margin-top:18px"><h3 data-i18n="unresolved"></h3><ul id="unresolvedList"></ul></div>
        <div class="result-section" style="margin-top:18px"><h3 data-i18n="specialistTasks"></h3><div id="specialistTaskList"></div></div>
        <div class="trace-grid">
          <div class="trace-card"><h3 data-i18n="alternativePaths"></h3><ul id="alternativeList"></ul></div>
          <div class="trace-card"><h3 data-i18n="conditionsAnotherPath"></h3><div class="action-list" id="actionList"></div></div>
        </div>
        <div class="result-actions">
          <button class="primary" id="pdfBtn" data-i18n="savePdf"></button>
          <button class="secondary" id="editBtn" data-i18n="edit"></button>
          <button class="secondary" id="restartBtn" data-i18n="restart"></button>
        </div>
      </div>
      <div class="privacy" data-i18n="resultNote"></div>
    </section>
  </main>
</div>

<script src="config.js"></script>

let lang="en", current=1, A={}, F={}, result=null, visibleIds=[], moduleCompleteState=false, diagnosticMode=false, gateStatus=null;

T.en.privacy="No login required. Assessment responses are sent to the decision engine for calculation and are not persistently stored by this implementation.";
T.de.privacy="Keine Anmeldung erforderlich. Die Assessment-Antworten werden zur Berechnung an die Decision Engine übertragen und von dieser Implementierung nicht dauerhaft gespeichert.";
T.en.resultNote="The recommendation is generated by the private deterministic decision engine implementing Toolkit V2. Outcomes are non-hierarchical and do not represent maturity levels.";
T.de.resultNote="Die Empfehlung wird durch die private deterministische Decision Engine auf Basis von Toolkit V2 erzeugt. Die Outcomes sind nicht hierarchisch und stellen keine Reifegrade dar.";

function apiBase(){return (window.SUFFICIENCY_COMPASS_API||"").replace(/\/+$/,"");}
function setApiError(msg){
 ["apiErrorAssessment","apiErrorResult"].forEach(id=>{
   const el=document.getElementById(id); if(!el)return;
   if(msg){el.textContent=msg;el.classList.remove("hidden")}else{el.textContent="";el.classList.add("hidden")}
 });
}
async function evaluate(intent="state"){
 const base=apiBase();
 if(!base || base.includes("REPLACE-WITH-ENGINE-URL")){
   throw new Error(lang==="en"?
   "The decision-engine URL has not been configured yet. Set window.SUFFICIENCY_COMPASS_API in config.js after the private engine is deployed.":
   "Die URL der Decision Engine ist noch nicht konfiguriert. Tragen Sie nach dem Deployment der privaten Engine die URL in config.js ein.");
 }
 const res=await fetch(base+"/evaluate",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({answers:A,framing:F,current_module:current,intent,lang})
 });
 if(!res.ok){
   let detail=""; try{detail=(await res.json()).detail||""}catch(e){}
   throw new Error(detail || `Engine request failed (${res.status})`);
 }
 const data=await res.json();
 A=data.answers||{}; F=data.framing||F; visibleIds=data.visible_question_ids||[]; moduleCompleteState=!!data.module_complete; diagnosticMode=!!data.diagnostic_mode; gateStatus=data.decision_gate_status||null;
 return data;
}
function i18n(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=T[lang][el.dataset.i18n]||""); document.querySelectorAll("[data-i18n-option]").forEach(el=>el.textContent=T[lang][el.dataset.i18nOption]||"");
 document.getElementById("langEN").classList.toggle("active",lang==="en");
 document.getElementById("langDE").classList.toggle("active",lang==="de");
 if(!document.getElementById("assessmentScreen").classList.contains("hidden")) renderModule();
 if(!document.getElementById("resultScreen").classList.contains("hidden")) renderResult(result);
}
function renderStepper(){
 const e=document.getElementById("stepper");e.innerHTML="";
 modules.forEach(m=>{const s=document.createElement("span");s.className="step-pill"+(m.id===current?" active":m.id<current?" done":"");s.textContent=`${m.id} ${m.title[lang].replace(/ &.*/,"")}`;e.appendChild(s)})
}
function optLabel(o){return lang==="en"?o[1]:o[2]}
function assistBase(){return (window.SUFFICIENCY_COMPASS_ASSIST_API||"").replace(/\/+$/,"")}
async function requestAssistance(x,mode,clarification=""){
 const base=assistBase(); if(!base) throw new Error(T[lang].assistUnavailable);
 const context=[F["DF.1"],F["DF.4"]].filter(Boolean).join(" · ").slice(0,500);
 const res=await fetch(base+"/assist",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     question_id:x.id,
     question_text:lang==="en"?x.en:x.de,
     answer_options:x.opts.map(optLabel),
     guidance:lang==="en"?x.helpEn:x.helpDe,
     mode,lang,clarification,decision_context:context
   })
 });
 if(!res.ok){
   let detail="";try{detail=(await res.json()).detail||""}catch(e){}
   throw new Error(detail||T[lang].assistUnavailable);
 }
 return await res.json();
}
function renderQuestion(x){
 const card=document.createElement("div");card.className="q-card";
 const help=lang==="en"?x.helpEn:x.helpDe;
 card.innerHTML=`<div class="q-head"><div class="q-id">${x.id}</div><div class="q-text">${lang==="en"?x.en:x.de}${x.multi?`<span class="multi-badge">${T[lang].multiSelect}</span>`:""}</div><div class="help"><button class="help-btn" aria-label="Help">?</button><div class="tooltip">${help}</div></div></div>`;
 const helpWrap=card.querySelector(".help"),helpBtn=card.querySelector(".help-btn");
 helpBtn.addEventListener("click",e=>{e.stopPropagation();helpWrap.classList.toggle("open")});
 const opts=document.createElement("div");opts.className="options";
 x.opts.forEach(o=>{
   const val=o[0],lab=document.createElement("label"),selected=x.multi?(A[x.id]||[]).includes(val):A[x.id]===val;
   lab.className="option"+(selected?" selected":"");
   lab.innerHTML=`<input type="${x.multi?"checkbox":"radio"}" name="${x.id}" value="${val}" ${selected?"checked":""}><span>${optLabel(o)}</span>`;
   lab.querySelector("input").addEventListener("change",async ev=>{
     if(x.multi){
       let arr=Array.isArray(A[x.id])?[...A[x.id]]:[];
       if(ev.target.checked){
         if(["cannot","no_value","none"].includes(val))arr=[val];
         else{arr=arr.filter(z=>!["cannot","no_value","none"].includes(z));if(!arr.includes(val))arr.push(val)}
       }else arr=arr.filter(z=>z!==val);
       A[x.id]=arr;
     }else A[x.id]=val;
     try{setApiError("");await evaluate("state")}catch(err){setApiError(err.message)}
     renderModule();
   });
   opts.appendChild(lab)
 });
 card.appendChild(opts);
 const ex=lang==="en"?x.examplesEn:x.examplesDe;
 if(ex&&ex.length){
   const b=document.createElement("button");b.className="examples-toggle";b.textContent=T[lang].examples+" ▾";
   const d=document.createElement("div");d.className="examples hidden";d.textContent=ex.join(" · ");
   b.addEventListener("click",()=>{d.classList.toggle("hidden");b.textContent=(d.classList.contains("hidden")?T[lang].examples:T[lang].hideExamples)+(d.classList.contains("hidden")?" ▾":" ▴")});
   card.appendChild(b);card.appendChild(d)
 }
 const v=A[x.id],isCannot=v==="cannot"||(Array.isArray(v)&&v.includes("cannot"));
 if(isCannot){
   const n=document.createElement("div");n.className="notice";
   const sp=specialistCheckpoints[x.id];
   n.innerHTML=`<strong>${T[lang].cannotTitle}</strong><br>${T[lang].cannotText}`+(sp?`<div class="specialist-checkpoint"><strong>${T[lang].specialistLabel}:</strong><br>${sp[lang]}</div>`:"");
   card.appendChild(n)
 }
 if(assistBase()){
   const box=document.createElement("div");box.className="assist-box";
   const toggle=document.createElement("button");toggle.type="button";toggle.className="assist-toggle";toggle.textContent=T[lang].assistOpen;
   const panel=document.createElement("div");panel.className="assist-panel hidden";
   const note=document.createElement("div");note.className="assist-note";note.textContent=T[lang].assistNote;
   const actions=document.createElement("div");actions.className="assist-actions";
   const output=document.createElement("div");output.className="assist-output hidden";
   const modes=[["explain",T[lang].assistExplain],["rephrase",T[lang].assistRephrase],["example",T[lang].assistExample],["options",T[lang].assistOptions]];
   const run=async(mode,clarification="")=>{
     output.classList.remove("hidden");output.classList.add("loading");output.textContent=T[lang].assistLoading;
     try{const data=await requestAssistance(x,mode,clarification);output.classList.remove("loading");output.textContent=data.text||T[lang].assistUnavailable}
     catch(err){output.classList.remove("loading");output.textContent=T[lang].assistUnavailable}
   };
   modes.forEach(([mode,label])=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.onclick=()=>run(mode);actions.appendChild(b)});
   const clarify=document.createElement("div");clarify.className="assist-clarify";
   const ta=document.createElement("textarea");ta.maxLength=350;ta.placeholder=T[lang].assistPlaceholder;
   const ask=document.createElement("button");ask.type="button";ask.className="assist-toggle";ask.textContent=T[lang].assistAsk;ask.onclick=()=>{if(ta.value.trim())run("clarify",ta.value.trim())};
   clarify.appendChild(ta);clarify.appendChild(ask);
   panel.appendChild(note);panel.appendChild(actions);panel.appendChild(clarify);panel.appendChild(output);
   toggle.onclick=()=>panel.classList.toggle("hidden");
   box.appendChild(toggle);box.appendChild(panel);card.appendChild(box)
 }
 return card
}
function renderModule(){
 renderStepper();
 const m=modules[current-1];
 document.getElementById("moduleCount").textContent=T[lang].moduleOf.replace("{n}",current);
 document.getElementById("moduleTitle").textContent=m.title[lang];
 document.getElementById("modulePurpose").textContent=m.purpose[lang];
 document.getElementById("progressFill").style.width=`${(current/6)*100}%`;
 const db=document.getElementById("diagnosticBanner");
 if(diagnosticMode){db.innerHTML=`<strong>${T[lang].diagnosticTitle}</strong><br>${T[lang].diagnosticText}`;db.classList.remove("hidden")}else db.classList.add("hidden");
 const box=document.getElementById("questions");box.innerHTML="";
 questions.filter(x=>x.module===current && visibleIds.includes(x.id)).forEach(x=>box.appendChild(renderQuestion(x)));
 document.getElementById("backBtn").disabled=false;
 const finishBtn=document.getElementById("finishBtn");
 finishBtn.classList.toggle("hidden",!diagnosticMode);
 const continueBtn=document.getElementById("continueBtn");
 continueBtn.textContent=diagnosticMode?T[lang].continueDiagnostic:T[lang].continue;
 continueBtn.disabled=!moduleCompleteState && !diagnosticMode;
}
function fillList(id,items,emptyText=""){
 const el=document.getElementById(id); if(!el)return; el.innerHTML="";
 (items||[]).forEach(x=>{const li=document.createElement("li");li.textContent=typeof x==="string"?x:(x.text||JSON.stringify(x));el.appendChild(li)});
 if(!(items||[]).length && emptyText){const li=document.createElement("li");li.textContent=emptyText;el.appendChild(li)}
}
function renderResult(r){
 if(!r)return;
 const card=document.getElementById("resultCard");card.style.setProperty("--outcome",r.color||"var(--petrol)");
 document.getElementById("resultTitle").textContent=r.title;
 document.getElementById("resultDesc").textContent=r.description;
 document.getElementById("decisionContextText").textContent=r.decision_context||"";
 const gs=r.decision_gate_status||{}; const blockers=(gs.blockers||[]).map(x=>x.text).join(" · ");
 document.getElementById("gateStatusText").textContent=(gs.status||"").toUpperCase()+(blockers?": "+blockers:"");
 document.getElementById("economicText").textContent=r.economic_sufficiency||"";
 const wl=document.getElementById("whyList");wl.innerHTML="";(r.why||[]).forEach(x=>{const li=document.createElement("li");li.textContent=x;wl.appendChild(li)});
 document.getElementById("nextText").textContent=r.next_step||"";
 fillList("unresolvedList",r.unresolved_conditions||[],T[lang].noIssues);
 const st=document.getElementById("specialistTaskList");st.innerHTML="";
 (r.specialist_tasks||[]).forEach(a=>{const d=document.createElement("div");d.className="specialist-task";d.innerHTML=`<b>${a.question_id} · ${a.who}</b><div>${a.why}</div><div><strong>Verify:</strong> ${a.verify}</div><div><strong>Evidence:</strong> ${a.evidence_required}</div>`;st.appendChild(d)});
 if(!(r.specialist_tasks||[]).length)st.textContent=T[lang].noIssues;
 fillList("alternativeList",r.alternative_paths||[]);
 const al=document.getElementById("actionList");al.innerHTML="";
 const acts=r.conditions_for_another_path||r.actions||[];
 if(!acts.length){const d=document.createElement("div");d.className="action-card";d.innerHTML=`<div class="action-card-text">${T[lang].noIssues}</div>`;al.appendChild(d)}
 else acts.forEach(a=>{const d=document.createElement("div");d.className="action-card"; if(typeof a==="string")d.innerHTML=`<div class="action-card-text">${a}</div>`; else d.innerHTML=`<div class="action-card-title">${a.title||""}</div><div class="action-card-text">${a.text||""}</div><span class="action-card-meta">${a.meta||""}</span>`;al.appendChild(d)})
}
function showResult(r){
 result=r;document.getElementById("assessmentScreen").classList.add("hidden");document.getElementById("startScreen").classList.add("hidden");document.getElementById("resultScreen").classList.remove("hidden");renderResult(r);window.scrollTo({top:0,behavior:"smooth"})
}

document.getElementById("startBtn").onclick=()=>{

 document.getElementById("framingScreen").classList.add("hidden");document.getElementById("assessmentScreen").classList.remove("hidden");current=1;

   if(data.result){showResult(data.result);return}
 }catch(err){setApiError(err.message)}
};
document.getElementById("continueBtn").onclick=async()=>{
 if(!moduleCompleteState)return;
 try{
   setApiError("");const data=await evaluate("continue");
   if(data.result){showResult(data.result);return}
   if(data.next_module){current=data.next_module;await evaluate("state");renderModule();window.scrollTo({top:0,behavior:"smooth"})}
 }catch(err){setApiError(err.message)}
};
document.getElementById("backBtn").onclick=async()=>{
 if(current<=1){document.getElementById("assessmentScreen").classList.add("hidden");document.getElementById("framingScreen").classList.remove("hidden");loadFramingToUI();window.scrollTo(0,0);return}current--;
 try{setApiError("");await evaluate("state")}catch(err){setApiError(err.message)}
 renderModule();window.scrollTo({top:0,behavior:"smooth"})
};
document.getElementById("langEN").onclick=async()=>{lang="en";i18n();if(!document.getElementById("assessmentScreen").classList.contains("hidden")){try{await evaluate("state");renderModule()}catch(e){setApiError(e.message)}}};
document.getElementById("langDE").onclick=async()=>{lang="de";i18n();if(!document.getElementById("assessmentScreen").classList.contains("hidden")){try{await evaluate("state");renderModule()}catch(e){setApiError(e.message)}}};
document.getElementById("pdfBtn").onclick=()=>window.print();
document.getElementById("editBtn").onclick=async()=>{document.getElementById("resultScreen").classList.add("hidden");document.getElementById("assessmentScreen").classList.remove("hidden");try{setApiError("");await evaluate("state")}catch(e){setApiError(e.message)}renderModule();window.scrollTo(0,0)};
document.getElementById("restartBtn").onclick=()=>{A={};F={};current=1;result=null;visibleIds=[];moduleCompleteState=false;diagnosticMode=false;gateStatus=null;document.getElementById("resultScreen").classList.add("hidden");document.getElementById("startScreen").classList.remove("hidden");i18n();window.scrollTo(0,0)};
document.addEventListener("click",e=>{if(!e.target.closest(".help"))document.querySelectorAll(".help.open").forEach(x=>x.classList.remove("open"))});
i18n();

</script>
